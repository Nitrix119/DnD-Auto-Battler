[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-auto-battler"
version = "0.1.0"
description = "D&D 5e combat simulator for automated battles"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nitrix119" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "pyyaml>=6.0",
]

[project.urls]
homepage = "https://github.com/Nitrix119/DnD-Auto-Battler"
